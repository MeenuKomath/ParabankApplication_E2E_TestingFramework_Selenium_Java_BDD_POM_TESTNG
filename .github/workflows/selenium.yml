name: ParaBank Selenium E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - edge
      tags:
        description: 'Cucumber tags to execute'
        required: false
        default: '@Smoke'
      threads:
        description: 'Parallel thread count (1 to 5)'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  run-automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Google Chrome
        if: ${{ (github.event.inputs.browser || 'chrome') == 'chrome' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Microsoft Edge
        if: ${{ github.event.inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: stable

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Maven TestNG Cucumber Suite
        run: |
          mvn clean test \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dheadless=true \
            -Ddataproviderthreadcount=${{ github.event.inputs.threads || '3' }} \
            -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@Smoke' }}"

      - name: Convert Videos to Browser-Compatible H.264 MP4
        if: always()
        run: |
          if [ -d "target/videos" ]; then
            for f in target/videos/*.mp4; do
              [ -e "$f" ] || continue
              ffmpeg -y -i "$f" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "${f%.mp4}_web.mp4" && mv "${f%.mp4}_web.mp4" "$f"
            done
          fi

      - name: Upload Test Reports, Logs, Screenshots & Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parabank-test-reports-${{ github.run_number }}
          path: |
            target/extent-reports/
            target/cucumber-reports/
            target/screenshots/
            target/videos/
            target/logs/
          retention-days: 14
